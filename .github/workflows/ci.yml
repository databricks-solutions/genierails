name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1-5'  # weekday nightly at 2 AM UTC

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # Full history: test_released_env_upgrade.py applies the pre-retirement
      # modules from git history and plans the current code against that state.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The coverage-gate enforcement tests drive real `terraform plan` /
      # `terraform test` (mock providers, no credentials) and skip without it.
      # The wrapper must be off: tests parse terraform's own stdout/stderr.
      # Pinned by commit (v3.1.2), not the mutable v3 tag.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Install dependencies
        run: pip install pytest python-hcl2

      - name: Run unit tests
        env:
          REQUIRE_TERRAFORM_TESTS: "1"
        run: pytest shared/tests/ -v

  validation:
    name: E2E Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-hcl2

      - name: Run validation tests
        run: cd shared && bash test.sh --skip-tf

  integration-tests-aws:
    name: Integration Tests (AWS)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-integration') || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned by commit (v3.1.2), not the mutable v3 tag, as in unit-tests.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Install dependencies
        run: pip install python-hcl2 databricks-sdk requests

      - name: Provision test environment
        env:
          DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_AWS_REGION: ${{ secrets.DATABRICKS_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python shared/scripts/provision_test_env.py provision

      - name: Run integration tests
        env:
          # Narrow N3 opt-out: this job applies only to the throwaway workspace
          # provisioned above. Never set this at workflow or unit-test scope.
          GENIERAILS_ALLOW_CI_APPLY: "1"
          DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          CLOUD_PROVIDER: aws
        run: python shared/scripts/run_integration_tests.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-aws
          path: shared/scripts/logs/
          retention-days: 7

      - name: Teardown test environment
        if: always()
        env:
          DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python shared/scripts/provision_test_env.py teardown

  integration-tests-azure:
    name: Integration Tests (Azure)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-integration') || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned by commit (v3.1.2), not the mutable v3 tag, as in unit-tests.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Install dependencies
        run: pip install python-hcl2 databricks-sdk requests

      - name: Provision test environment
        env:
          DATABRICKS_ACCOUNT_ID: ${{ secrets.AZURE_DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ secrets.AZURE_DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.AZURE_DATABRICKS_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_REGION: ${{ secrets.AZURE_REGION }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python shared/scripts/provision_test_env.py provision

      - name: Run integration tests
        env:
          # Narrow N3 opt-out: this job applies only to the throwaway workspace
          # provisioned above. Never set this at workflow or unit-test scope.
          GENIERAILS_ALLOW_CI_APPLY: "1"
          DATABRICKS_ACCOUNT_ID: ${{ secrets.AZURE_DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ secrets.AZURE_DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.AZURE_DATABRICKS_CLIENT_SECRET }}
          CLOUD_PROVIDER: azure
        run: python shared/scripts/run_integration_tests.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-azure
          path: shared/scripts/logs/
          retention-days: 7

      - name: Teardown test environment
        if: always()
        env:
          DATABRICKS_ACCOUNT_ID: ${{ secrets.AZURE_DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ secrets.AZURE_DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.AZURE_DATABRICKS_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python shared/scripts/provision_test_env.py teardown
