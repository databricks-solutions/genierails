name: GenieRails dev (azure)

# Stage 3, "Dev rehearsal", of shared/docs/pipelines.md: on every merge to main that
# touches code, governance or envs/**. Copy to .github/workflows/ at the
# repository root.
#
# Every commit gets its own run, in commit order, and no run is ever
# cancelled. There is deliberately no concurrency group (GitHub cancels a
# pending run when a newer one queues); the queue job instead waits until
# every earlier run of this workflow has finished.
#
# Requires locked remote_state.hcl files for both envs/dev and envs/account.
# The stage's command is
#
#   make rehearse ENV=dev
#
# Both dev and the read-only account plan use shared, locked remote state;
# the runner's GENIERAILS_STATE_DIR holds only throwaway runtime files. A run
# stops when a newer main commit changes azure/ or shared/ (that commit's own
# run rehearses both), so re-running an old run never applies older code
# after newer. A newer commit outside those paths (README, .github/) starts
# no run of its own, so it never stops this one.
# The CI guard permits only this dev rehearsal when locked remote state is
# configured. Never set GENIERAILS_ALLOW_CI_APPLY in a customer pipeline.
#
# Auth: OIDC workload identity federation, no PATs or secrets. Variables
# (IDs, not credentials) where make bootstrap-pipelines prints them.
# Repository variables:
#   DATABRICKS_ACCOUNT_ID  DEV_DATABRICKS_WORKSPACE_ID  DEV_DATABRICKS_WORKSPACE_HOST
# The "dev" environment's variables (the dev deployer and dev state identity):
#   DEV_DEPLOYER_CLIENT_ID  DEV_STATE_CLIENT_ID  AZURE_TENANT_ID  AZURE_SUBSCRIPTION_ID

on:
  push:
    branches: [main]
    paths:
      - 'azure/**'
      - 'shared/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: azure

jobs:
  queue:
    name: Wait for earlier dev runs
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait until every earlier run of this workflow has finished
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          while :; do
            earlier="$(gh api "repos/${{ github.repository }}/actions/workflows/${workflow}/runs?branch=main&per_page=100" \
              --jq '[.workflow_runs[] | select(.run_number < ${{ github.run_number }} and .status != "completed")] | length')"
            [ "$earlier" = 0 ] && break
            echo "Waiting for ${earlier} earlier dev run(s) to finish..."
            sleep 30
          done

  rehearse:
    name: Dev rehearsal
    needs: queue
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.DEV_STATE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # The runner context is not available in a job-level env. GenieRails
      # never creates a missing GENIERAILS_STATE_DIR (a mistyped one must not
      # read as empty), so this throwaway one is created here.
      - name: Use the runner's temp dir for runtime files
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/genierails-state"
          echo "GENIERAILS_STATE_DIR=$RUNNER_TEMP/genierails-state" >> "$GITHUB_ENV"

      # A re-run of an older run keeps its run_number, so the queue alone
      # would let it apply older code after a newer commit rehearsed: only
      # the newest main commit that changes this workflow's paths rehearses.
      - name: Refuse an obsolete commit
        run: |
          git fetch --no-tags origin main
          newest="$(git log -1 --format=%H FETCH_HEAD -- . ../shared)" || exit $?
          if [ "$(git rev-parse HEAD)" != "$newest" ]; then
            echo "::error::${{ github.sha }} is obsolete: main's newer commit $newest changes azure/ or shared/, and its run rehearses it."
            exit 1
          fi

      - name: Require locked remote state for dev and account
        run: |
          test -f envs/dev/remote_state.hcl && test -f envs/account/remote_state.hcl || {
            echo "::error::commit envs/dev/remote_state.hcl and envs/account/remote_state.hcl (shared/docs/pipelines.md)"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install 'python-hcl2>=7.3.1,<8' 'databricks-sdk==0.150.0' pytest

      # Pinned by commit (v3.1.2), with the Terraform the repository's CI tests.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.DEV_STATE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Write OIDC auth file (IDs only, no secrets)
        env:
          ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.DEV_DEPLOYER_CLIENT_ID }}
          WORKSPACE_ID: ${{ vars.DEV_DATABRICKS_WORKSPACE_ID }}
          HOST: ${{ vars.DEV_DATABRICKS_WORKSPACE_HOST }}
        run: |
          mkdir -p envs/dev
          printf '%s\n' \
            "databricks_account_id     = \"$ACCOUNT_ID\"" \
            "databricks_client_id      = \"$CLIENT_ID\"" \
            'databricks_client_secret  = ""' \
            "databricks_workspace_id   = \"$WORKSPACE_ID\"" \
            "databricks_workspace_host = \"$HOST\"" > envs/dev/auth.auto.tfvars

      - name: Read-only check of the merged commit
        run: make check ENV=dev

      - name: Rehearse dev
        run: make rehearse ENV=dev

      # For the record only: release-plan trusts a receipt only in the store
      # that wrote it, and the prod workflow doesn't download this.
      - name: Publish the rehearsal receipt (informational)
        uses: actions/upload-artifact@v4
        with:
          name: genierails-dev-receipt-azure-${{ github.sha }}
          path: ${{ runner.temp }}/genierails-state/azure/dev/receipts/rehearse/
          if-no-files-found: error
          retention-days: 90
