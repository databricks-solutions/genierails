# GenieRails dev (azure), Azure DevOps. Name the pipeline "genierails-dev-azure":
# the prod pipeline triggers on it by that name.
#
# Stage 3, "Dev rehearsal", of shared/docs/pipelines.md: on every merge to main that
# touches code, governance or envs/**. Every commit gets its own run
# (batch: false), runs queue in commit order and none is ever cancelled:
# lockBehavior: sequential plus an Exclusive Lock check on the
# "genierails-dev" environment.
#
# Requires locked remote_state.hcl files for both envs/dev and envs/account.
# The stage's command is
#
#   make rehearse ENV=dev
#
# Both dev and the read-only account plan use shared, locked remote state;
# the runner's GENIERAILS_STATE_DIR holds only throwaway runtime files. A run
# stops when a newer main commit changes azure/ or shared/ (that commit's own
# run rehearses both), so re-running an old run never applies older code
# after newer. A newer commit outside those paths (README, pipelines) starts
# no run of its own, so it never stops this one.
# The CI guard permits only this dev rehearsal when locked remote state is
# configured. Never set GENIERAILS_ALLOW_CI_APPLY in a customer pipeline.
#
# Auth: OIDC workload identity federation (azure-devops-oidc), no PATs or
# secrets. Variable group "genierails-ids" holds the IDs:
#   DATABRICKS_ACCOUNT_ID  DEV_DEPLOYER_CLIENT_ID
#   DEV_DATABRICKS_WORKSPACE_ID  DEV_DATABRICKS_WORKSPACE_HOST  AZURE_SUBSCRIPTION_ID

trigger:
  batch: false
  branches:
    include: [main]
  paths:
    include: [azure, shared]

pr: none

lockBehavior: sequential

variables:
  - group: genierails-ids
  - name: TERRAFORM_VERSION
    value: '1.11.4'

stages:
  - stage: Rehearse
    displayName: Dev rehearsal
    jobs:
      - deployment: rehearse
        pool:
          vmImage: ubuntu-latest
        environment: genierails-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # A re-run of an older run must not apply older code after a
                # newer commit rehearsed: only the newest main commit that
                # changes this pipeline's paths rehearses.
                - script: |
                    git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" fetch --no-tags origin main || exit 1
                    newest="$(git log -1 --format=%H FETCH_HEAD -- . ../shared)" || exit 1
                    if [ "$(git rev-parse HEAD)" != "$newest" ]; then
                      echo "##[error]$(Build.SourceVersion) is obsolete: main's newer commit $newest changes azure/ or shared/, and its run rehearses it."
                      exit 1
                    fi
                    test -f envs/dev/remote_state.hcl && test -f envs/account/remote_state.hcl || {
                      echo "##[error]commit envs/dev/remote_state.hcl and envs/account/remote_state.hcl (shared/docs/pipelines.md)"
                      exit 1
                    }
                  displayName: Refuse an obsolete commit; require remote state
                  workingDirectory: azure
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '3.11'

                - script: |
                    pip install 'python-hcl2>=7.3.1,<8' 'databricks-sdk==0.150.0' pytest
                    curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/$(TERRAFORM_VERSION)/terraform_$(TERRAFORM_VERSION)_linux_amd64.zip"
                    sudo unzip -o -q /tmp/terraform.zip -d /usr/local/bin
                  displayName: Install dependencies and Terraform

                - script: |
                    mkdir -p envs/dev
                    printf '%s\n' \
                      "databricks_account_id     = \"$ACCOUNT_ID\"" \
                      "databricks_client_id      = \"$CLIENT_ID\"" \
                      'databricks_client_secret  = ""' \
                      "databricks_workspace_id   = \"$WORKSPACE_ID\"" \
                      "databricks_workspace_host = \"$HOST\"" > envs/dev/auth.auto.tfvars
                  displayName: Write OIDC auth file (IDs only, no secrets)
                  workingDirectory: azure
                  env:
                    ACCOUNT_ID: $(DATABRICKS_ACCOUNT_ID)
                    CLIENT_ID: $(DEV_DEPLOYER_CLIENT_ID)
                    WORKSPACE_ID: $(DEV_DATABRICKS_WORKSPACE_ID)
                    HOST: $(DEV_DATABRICKS_WORKSPACE_HOST)

                - script: make check ENV=dev
                  displayName: Read-only check of the merged commit
                  workingDirectory: azure
                  env:
                    DATABRICKS_AUTH_TYPE: azure-devops-oidc
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

                # The service connection must use workload identity federation.
                - task: AzureCLI@2
                  displayName: Rehearse dev
                  inputs:
                    azureSubscription: genierails-dev-state-azure
                    addSpnToEnvironment: true
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: azure
                    inlineScript: |
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      # GenieRails never creates a missing GENIERAILS_STATE_DIR; this throwaway one is made here.
                      mkdir -p -m 700 "$GENIERAILS_STATE_DIR"
                      make rehearse ENV=dev
                  env:
                    DATABRICKS_AUTH_TYPE: azure-devops-oidc
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    GENIERAILS_STATE_DIR: $(Agent.TempDirectory)/genierails-state
                    ARM_USE_OIDC: true
                    ARM_USE_AZUREAD: true
                    ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)

                - publish: $(Agent.TempDirectory)/genierails-state/azure/dev/receipts/rehearse
                  artifact: genierails-dev-receipt-azure-$(Build.SourceVersion)
                  displayName: Publish the rehearsal receipt (informational; release-plan never trusts a copy)
